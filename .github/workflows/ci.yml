name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the live browser suite (Docker + local Supabase stack, ~10 min)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, unit, database, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests (security audit, providers, notifications, chat, newsroom)
        run: bun run test
      - name: PostgreSQL 16 for the database tests
        run: |
          if [ ! -x "$PG_BIN/initdb" ]; then sudo apt-get update -y && sudo apt-get install -y postgresql-16; fi
          sudo systemctl stop postgresql || true
      - name: Database tests (real PostgreSQL, every migration)
        run: bun run test:db
      - name: Migration + rollback rehearsals
        run: |
          scripts/test-db.sh start >/dev/null
          for s in rollback-rehearsal-m4 rollback-rehearsal-m5b rollback-rehearsal-payments rollback-rehearsal-m6; do
            echo "::group::$s"; bash scripts/$s.sh; echo "::endgroup::"
          done
      - name: Build
        run: bun run build
      - name: Dependency audit (production-relevant severity gate)
        run: bun audit --audit-level=critical

  e2e:
    name: Playwright critical flows (smoke)
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    env:
      # the smoke flows only need the app to boot and render public pages
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_SUPABASE_PROJECT_ID: ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test e2e/smoke.spec.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  live:
    name: Live browser suite (real auth, RLS, Realtime, payments with mock providers)
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Local Supabase-equivalent stack
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-16 postgresql-16-wal2json
          sudo systemctl stop postgresql || true
          scripts/live-stack/up.sh
      - name: App + mock providers + live specs
        env:
          PLAYWRIGHT_CHROMIUM_PATH: ""
        run: |
          set -a; . /tmp/live.env; set +a; . scripts/live-stack/app-env.sh
          nohup node scripts/live-stack/mock-providers.mjs > /tmp/mock.log 2>&1 &
          nohup bun run dev --host 127.0.0.1 --port 4173 --strictPort > /tmp/dev.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 2; done
          bunx playwright test -c playwright.live.config.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-results
          path: test-results/
          retention-days: 7
